name: Publish v0.0.3 — verified Full and Lite fork VPKs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.0.3.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: v0.0.3-release
  cancel-in-progress: false

jobs:
  stage-cobalt:
    if: github.repository == 'joaopedr00000/YouTubeOnVita-NoAds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify v0.0.3 source regressions and fork IDs
        shell: bash
        run: |
          set -euo pipefail
          node tools/test_cobalt_adblock.cjs
          node tools/test_vm_data_mappings.cjs
          node tools/test_sponsorblock_threading.cjs
          node tools/test_fork_data_isolation.cjs
          node tools/test_modifications_menu.cjs
          grep -Fq -- '-DYTV_COBALT_APP_VERSION=00.03' .github/workflows/build-vita.yml
          grep -Fq 'set(YTV_COBALT_APP_VERSION "00.03"' CMakeLists.txt
          grep -Fq 'set(VITA_TITLEID "YTVNX0001")' CMakeLists.txt
          grep -Fq 'set(VITA_TITLEID "YTVNX0002")' CMakeLists.txt
          grep -Fq '## Credits' RELEASE_NOTES_v0.0.3.md
          python3 -m py_compile tools/prepare_cobalt_adblock.py
      - name: Retrieve exact source-built Cobalt runtime used by the fork
        uses: actions/download-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          run-id: 45571393792
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify staged source-built runtime and matching profile
        run: |
          set -euo pipefail
          test -s candidate/libcobalt.so
          test -s candidate/cobalt_candidate_profile.h
          test -d candidate/content
          (cd candidate && sha256sum -c SHA256SUMS)
          printf '%s\n' '1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4  candidate/libcobalt.so' | sha256sum -c -
          grep -Fq 'CANDIDATE_SHA256 "1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4"' candidate/cobalt_candidate_profile.h
      - name: Stage candidate for the reusable Vita build job
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          path: candidate/
          if-no-files-found: error

  build:
    needs: stage-cobalt
    uses: ./.github/workflows/build-vita.yml
    with:
      custom_cobalt: true

  publish:
    needs: build
    if: github.repository == 'joaopedr00000/YouTubeOnVita-NoAds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download just-built source-Cobalt Full and Lite VPKs
        uses: actions/download-artifact@v4
        with:
          name: YouTubeOnVita-experimental-cobalt-VPKs
          path: release-assets
      - name: Verify VPK integrity, app IDs, names, internal version and exact runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, struct
          runtime='1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4'
          def metadata(data):
              magic,ver,key_table,value_table,n=struct.unpack_from('<4sIIII',data)
              assert magic==b'\x00PSF', magic
              result={}
              for i in range(n):
                  key_off,align,kind,size,max_size,data_off=struct.unpack_from('<HBBIII',data,20+16*i)
                  key=data[key_table+key_off:].split(b'\x00',1)[0].decode('ascii')
                  value=data[value_table+data_off:value_table+data_off+size].rstrip(b'\x00')
                  result[key]=value.decode('utf-8','replace')
              return result
          for variant,title,app_id in [('Full','YouTube','YTVNX0001'),('Lite','YouTube Lite','YTVNX0002')]:
              original=pathlib.Path('release-assets')/f'YouTube-{variant}.vpk'
              assert original.is_file() and original.stat().st_size>1_000_000,original
              with zipfile.ZipFile(original) as z:
                  assert z.testzip() is None, f'Corrupt archive {original}'
                  assert len(z.read('eboot.bin'))>100_000
                  assert hashlib.sha256(z.read('libcobalt.so')).hexdigest()==runtime,variant
                  info=metadata(z.read('sce_sys/param.sfo'))
                  assert info.get('APP_VER')=='00.03',info
                  assert info.get('TITLE_ID')==app_id,info
                  assert info.get('TITLE')==title,info
                  assert 'Candidate' not in str(info),info
                  print(f'{variant}: OK - app {app_id} version {info["APP_VER"]}; Cobalt SHA256 verified')
              original.rename(pathlib.Path('release-assets')/f'YouTube-{variant}-v0.0.3.vpk')
          PY
          (cd release-assets && sha256sum YouTube-*-v0.0.3.vpk > SHA256SUMS.txt)
      - name: Publish distinct v0.0.3 prerelease, without modifying previous assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.0.3" >/dev/null 2>&1; then
            echo 'v0.0.3 already published: refusing to overwrite assets' >&2
            exit 1
          fi
          gh release create v0.0.3 \
            release-assets/YouTube-Full-v0.0.3.vpk \
            release-assets/YouTube-Lite-v0.0.3.vpk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'YouTubeOnVita-NoAds v0.0.3 — Tweaks and CI Fix 🇧🇷' \
            --notes-file RELEASE_NOTES_v0.0.3.md \
            --prerelease
      - name: Verify final release assets and credits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.0.3" \
            --jq '{tag_name,name,prerelease,assets:[.assets[].name]}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.0.3" --jq '.assets|length')" -eq 3
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.0.3" --jq '.body' \
            | grep -Fq 'https://github.com/WolffsRoom/YouTubeOnVita'
