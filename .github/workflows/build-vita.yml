name: Build Vita Full and Lite
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      custom_cobalt:
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['CMakeLists.txt', 'experiments/**', 'tools/**', '.github/workflows/build-vita.yml']
  pull_request:
    branches: [main]
    paths: ['CMakeLists.txt', 'experiments/**', 'tools/**', '.github/workflows/build-vita.yml']
concurrency:
  group: vita-build-${{ github.ref }}-${{ inputs.custom_cobalt == true && 'candidate' || 'baseline' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test experimental source-only JSON filter
        run: |
          node tools/test_cobalt_adblock.cjs
          node tools/test_vm_data_mappings.cjs
          node tools/test_sponsorblock_threading.cjs
          python3 -m py_compile tools/prepare_cobalt_adblock.py
      - name: Fetch verified upstream Cobalt runtime and headers (partial filtering only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/cobalt/evergreen/core25/lib
          curl --fail --location --retry 3 https://github.com/youtube/cobalt/releases/download/25.lts.50/cobalt_evergreen_5.50.2_arm-hardfp_sbversion-15_release.crx -o "$RUNNER_TEMP/cobalt.crx"
          echo "be5b93dc4dcd42bd8dea5bfda728e6a170a17d6eef913b2cf78d370ac5e011dd  $RUNNER_TEMP/cobalt.crx" | sha256sum -c -
          python3 - "$RUNNER_TEMP/cobalt.crx" <<'PY'
          import io, pathlib, struct, sys, zipfile
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          assert raw[:4] == b'Cr24'
          version = struct.unpack_from('<I', raw, 4)[0]
          if version == 3:
              offset = 12 + struct.unpack_from('<I', raw, 8)[0]
          elif version == 2:
              offset = 16 + sum(struct.unpack_from('<II', raw, 8))
          else:
              raise ValueError('Unsupported CRX version')
          with zipfile.ZipFile(io.BytesIO(raw[offset:])) as z:
              data = z.read('lib/libcobalt.so')
              assert data[:6] == bytes.fromhex('7f454c460101')
              pathlib.Path('experiments/cobalt/evergreen/core25/lib/libcobalt.so').write_bytes(data)
          PY
          git clone --filter=blob:none --no-checkout https://github.com/youtube/cobalt.git experiments/cobalt/upstream-25
          git -C experiments/cobalt/upstream-25 sparse-checkout init --cone
          git -C experiments/cobalt/upstream-25 sparse-checkout set starboard
          git -C experiments/cobalt/upstream-25 checkout --detach 762d9bfda894dd22cc5d47200f9994c3027514eb
      - name: Download exact source-built Cobalt candidate
        if: ${{ inputs.custom_cobalt == true }}
        uses: actions/download-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          path: candidate
      - name: Verify candidate
        if: ${{ inputs.custom_cobalt == true }}
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
          test -s candidate/cobalt_candidate_profile.h
          test -d candidate/content
      - name: Fetch pinned HTTPS source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/shorelight82/vitube-vpk.git third_party/vitube
          git -C third_party/vitube sparse-checkout init --cone
          git -C third_party/vitube sparse-checkout set external/vita-https
          git -C third_party/vitube checkout --detach a8c4ac8405e13ca1ec6e7c64ae6d888649c9de9f
      - name: Build both VPKs in VitaSDK
        shell: bash
        env:
          CUSTOM_COBALT: ${{ inputs.custom_cobalt == true && '1' || '0' }}
        run: |
          docker run --rm -e CUSTOM_COBALT -v "$PWD:/src" -w /src -e VITASDK=/usr/local/vitasdk vitasdk/vitasdk:latest bash -lc '
            set -euo pipefail
            export PATH="$VITASDK/bin:$PATH"
            # Match the header to the vendored no-splash VitaGL static library.
            install -m 0644 third_party/vitagl-nosplash-build/source/vitaGL.h "$VITASDK/arm-vita-eabi/include/vitaGL.h"
            vdpm mbedtls
            bash third_party/vitube/external/vita-https/tools/build-curl-mbedtls.sh
            mkdir -p dist
            for variant in Full Lite; do
              lite=OFF; filename=YouTube.vpk
              if [ "$variant" = Lite ]; then lite=ON; filename=YouTube-Lite.vpk; fi
              extra=()
              if [ "$CUSTOM_COBALT" = 1 ]; then
                extra+=(-DYTV_CUSTOM_COBALT_DIR=/src/candidate)
                filename=YouTube-Full.vpk
                if [ "$variant" = Lite ]; then filename=YouTube-Lite.vpk; fi
              fi
              cmake -S . -B "build-$variant" "${extra[@]}" -DCMAKE_BUILD_TYPE=Release -DYTV_NATIVE_HARDENED_CURL=ON -DYTV_PACKAGE_LITE="$lite" -DYTV_COBALT_APP_VERSION=00.02 -DYTV_NATIVE_DOWNLOAD_TEST=OFF -DYTV_V061_RX_CHUNKS=ON -DYTV_V061_THREE_CORES=OFF
              cmake --build "build-$variant" --target "$filename-vpk" -j4
              if [ "$CUSTOM_COBALT" = 1 ]; then
                cp "build-$variant/$filename" "dist/YouTube-$variant.vpk"
              else
                cp "build-$variant/$filename" "dist/YouTube-NoAds-$variant.vpk"
              fi
            done
          '
      - name: Verify candidate VPK embeds exact modified runtime
        if: ${{ inputs.custom_cobalt == true }}
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          expected = hashlib.sha256(pathlib.Path('candidate/libcobalt.so').read_bytes()).hexdigest()
          packages = [pathlib.Path('dist') / f'YouTube-{variant}.vpk' for variant in ('Full', 'Lite')]
          assert all(p.is_file() and p.stat().st_size > 0 for p in packages)
          for package in packages:
              with zipfile.ZipFile(package) as z:
                  assert hashlib.sha256(z.read('libcobalt.so')).hexdigest() == expected
          print('Both candidate VPKs contain exact modified Cobalt:', expected)
          PY
          echo 'Experimental candidate, not validated on Vita hardware.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report packaged runtime provenance
        if: ${{ inputs.custom_cobalt != true }}
        run: |
          echo '## Full/Lite baseline — partial ad filtering only' >> "$GITHUB_STEP_SUMMARY"
          echo '⚠️ These VPKs use the official UNMODIFIED Cobalt runtime. The JS preload is NOT PACKAGED or active. Ads may appear; do not use this build to replace a working experimental no-ads VPK.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'No baseline VPK uploaded from this PR. The experimental pipeline will generate a separate verified candidate with the native crash fix and actual adblock preload.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Baseline VPKs lack the Cobalt preload even when native AdBlock is on.
      # Do not offer them as installable artifacts on bug-fix PRs: a tester
      # could otherwise replace a working experimental NoAds installation.
      # Only candidate builds with hash-verified modified libcobalt.so may
      # produce VPK artifacts from pull requests.
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.custom_cobalt == true || github.event_name != 'pull_request' }}
        with:
          name: ${{ inputs.custom_cobalt == true && 'YouTubeOnVita-experimental-cobalt-VPKs' || 'YouTubeOnVita-PARTIAL-FILTER-upstream-Cobalt-NOT-NoAds' }}
          path: dist/*.vpk
          if-no-files-found: error
