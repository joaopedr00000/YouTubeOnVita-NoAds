name: Experimental PS Vita 508KiB crash trace (NO release)

on:
  push:
    branches: ['experiments/vm-508k-crash-trace']
    paths:
      - '.github/workflows/experiment-vm-508k-trace.yml'
      - 'experiments/cobalt/vita/port_virtual_memory.cpp'
      - 'experiments/cobalt/vita/platform15.cpp'
      - 'tools/tests/test_vm_page_protection.cpp'
      - 'tools/test_vm_data_mappings.cjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vita-vm-508k-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-verified-cobalt:
    if: github.repository == 'joaopedr00000/YouTubeOnVita-NoAds'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static and native VM host-call tests
        shell: bash
        run: |
          set -euo pipefail
          node tools/test_vm_data_mappings.cjs
          g++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I tools/tests/vm_stubs tools/tests/test_vm_page_protection.cpp \
            -o /tmp/vm-508k-trace-tests
          /tmp/vm-508k-trace-tests
          grep -Fq 'strncmp(m,"YTV_VM_TRACE_",sizeof("YTV_VM_TRACE_")-1)==0' \
            experiments/cobalt/vita/platform15.cpp
      - name: Download unchanged v0.0.3 source-built Cobalt (for A/B comparison)
        uses: actions/download-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          run-id: 45571393792
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify precise original Cobalt bytes and profile
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
          printf '%s\n' '1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4  candidate/libcobalt.so' | sha256sum -c -
          grep -Fq 'CANDIDATE_SHA256 "1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4"' candidate/cobalt_candidate_profile.h
          grep -aq 'ytv-adblock-preload.js' candidate/libcobalt.so
          test -d candidate/content
      - name: Stage pinned runtime for reused Vita SDK build
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          path: candidate/
          if-no-files-found: error
          retention-days: 14

  build-experimental-vpks:
    needs: stage-verified-cobalt
    uses: ./.github/workflows/build-vita.yml
    with:
      custom_cobalt: true

  verify-archives:
    needs: [stage-verified-cobalt,build-experimental-vpks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YouTubeOnVita-experimental-cobalt-VPKs
          path: packages
      - name: Validate both VPKs, title IDs, and original runtime checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          expected='1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4'
          for variant,title_id in [('Full','YTVNX0001'),('Lite','YTVNX0002')]:
            path=pathlib.Path('packages')/f'YouTube-{variant}.vpk'
            assert path.is_file() and path.stat().st_size>1_000_000
            with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('libcobalt.so')).hexdigest()==expected
              assert title_id.encode() in z.read('sce_sys/param.sfo')
              assert len(z.read('eboot.bin'))>100_000
            print('PASS',variant,title_id,'original Cobalt retained')
          PY
          echo 'VM tracing only in experiments/vm-508k-crash-trace. Not validated on PS Vita and no release created.' >> "$GITHUB_STEP_SUMMARY"
