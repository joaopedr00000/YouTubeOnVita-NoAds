name: Build PS Vita crash fix with proven experimental NoAds Cobalt
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cobalt/vita/port_virtual_memory.cpp'
      - 'tools/test_vm_data_mappings.cjs'
      - '.github/workflows/build-vita-with-proven-noads.yml'
      - '.github/workflows/build-vita.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: proven-noads-crashfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-verified-cobalt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check V8 memory fix
        run: node tools/test_vm_data_mappings.cjs
      - name: Download exact previous working Cobalt (25 Nov 2026)
        uses: actions/download-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          run-id: 45571393792
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Verify known NoAds Cobalt SHA-256 and preload marker
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate/libcobalt.so
          test -s candidate/cobalt_candidate_profile.h
          test -d candidate/content
          (cd candidate && sha256sum -c SHA256SUMS)
          printf '%s\n' '1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4  candidate/libcobalt.so' | sha256sum -c -
          grep -Fq 'CANDIDATE_SHA256 "1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4"' candidate/cobalt_candidate_profile.h
          grep -aq 'ytv-adblock-preload.js' candidate/libcobalt.so
          echo 'Verified original experimental NoAds Cobalt, SHA256 1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: successful main experimental build 45571393792, not the upstream partial-filter baseline.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stage exact runtime for reusable VPK build
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          path: candidate/
          if-no-files-found: error
          retention-days: 10

  package-verified-noads:
    needs: stage-verified-cobalt
    uses: ./.github/workflows/build-vita.yml
    with:
      custom_cobalt: true
