name: VM page-granular fix — experimental Full+Lite VPKs (NO release)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-vm-page-fix-test.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vm-page-fix-experimental-test
  cancel-in-progress: false

jobs:
  stage-proven-cobalt:
    if: github.repository == 'joaopedr00000/YouTubeOnVita-NoAds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Recheck VM port with host-call tests
        shell: bash
        run: |
          set -euo pipefail
          node tools/test_vm_data_mappings.cjs
          g++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I tools/tests/vm_stubs tools/tests/test_vm_page_protection.cpp \
            -o /tmp/ytv-vm-policy-test
          /tmp/ytv-vm-policy-test
          echo 'PASS: host-call tests. Not real Vita kernel testing.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retrieve exact source-built Cobalt runtime from the previous release
        uses: actions/download-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          run-id: 45571393792
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact Cobalt runtime, content and loader profile
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
          printf '%s\n' \
            '1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4  candidate/libcobalt.so' \
            | sha256sum -c -
          test -s candidate/cobalt_candidate_profile.h
          test -d candidate/content
          grep -Fq 'CANDIDATE_SHA256 "1aa4c117417f943e5f6595edcdf5ab462ab4f6e6f1074829bd3111538291a7c4"' candidate/cobalt_candidate_profile.h
          echo 'Only Vita native VM implementation changed; embedded Cobalt bytes unchanged.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stage verified Cobalt for reusable VitaSDK workflow
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-vita-candidate-input
          path: candidate/
          if-no-files-found: error

  build-test-vpks:
    needs: stage-proven-cobalt
    uses: ./.github/workflows/build-vita.yml
    with:
      custom_cobalt: true
